site_name: cmuts
site_description: Fast, multithreaded pair-HMM counting of MaP-seq mutations.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# A bare filename takes its label from the page's heading, so the sidebar
# spells out only the order and the groups.
nav:
  - index.md
  - basics.md
  - output.md
  - Programs:
      - cmuts-hmm.md
      - cmuts-sub.md
      - cmuts-gen.md
  - Reference:
      - counting.md
      - clusters.md

# A page left out of the nav is reported at INFO, which --strict ignores and
# which would leave a new page reachable only by its URL.
validation:
  nav:
    omitted_files: warn

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # For the per-field divs on the output page, whose contents are markdown.
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
