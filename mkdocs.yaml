site_name: cmuts
site_description: Fast, multithreaded pair-HMM counting of MaP-seq mutations.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # For the per-field divs on the output page, whose contents are markdown.
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
