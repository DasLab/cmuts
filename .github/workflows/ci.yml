name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: ${{ matrix.os }}, ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
    env:
      # The Makefile declares CC conditionally, so this wins over the system cc.
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/dependencies
      - run: make check

  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [asan, tsan]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/dependencies
      - run: make check SAN=${{ matrix.san }}

  # clang-tidy reads the sources and nothing else, so one platform is enough.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/dependencies
      - run: sudo apt-get install -y clang-tidy
      - run: make lint
